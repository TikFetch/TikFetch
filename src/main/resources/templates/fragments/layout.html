<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head
    th:with="appName=${app != null ? app.name : 'TikFetch'}, pageTitle=${title != null && !title.isBlank() ? title : appName}, description='Download TikTok videos, photo posts, galleries, and MP3 audio without watermark or ads. Paste a public TikTok link and save media with TikFetch.'">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00c2ff">
    <title th:text="${pageTitle == appName ? appName : pageTitle + ' | ' + appName}">TikFetch</title>
    <meta name="description" th:content="${description}">
    <meta name="robots" th:content="${robotsContent}">
    <link th:if="${seoHomePage}" rel="canonical" th:href="${canonicalUrl}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" th:content="${appName}">
    <meta property="og:title" th:content="${pageTitle == appName ? appName : pageTitle + ' | ' + appName}">
    <meta property="og:description" th:content="${description}">
    <meta th:if="${seoHomePage}" property="og:url" th:content="${canonicalUrl}">
    <meta property="og:image" content="https://tikfetch.despical.dev/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="TikFetch icon">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" th:content="${pageTitle == appName ? appName : pageTitle + ' | ' + appName}">
    <meta name="twitter:description" th:content="${description}">
    <meta name="twitter:image" content="https://tikfetch.despical.dev/icon-512.png">
    <script th:if="${seoHomePage}" type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "TikFetch",
            "url": "https://tikfetch.despical.dev/",
            "description": "Download TikTok videos, photo posts, galleries, and MP3 audio without watermark or ads.",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Any",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            },
            "featureList": [
                "TikTok video downloads without watermark",
                "TikTok photo gallery downloads",
                "MP3 audio downloads"
            ]
        }
    </script>
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/dist/assets/app.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HNMKGXGGXD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-HNMKGXGGXD');
    </script>
    <script type="module" src="/dist/assets/app.js" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-950 antialiased">
<main th:replace="${content}"></main>
<div th:replace="~{fragments/scroll-top :: scrollTop}"></div>
</body>
</html>
