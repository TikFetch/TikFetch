buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath 'org.flywaydb:flyway-mysql:12.11.0'
        classpath 'com.mysql:mysql-connector-j:9.7.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '12.11.0'
}

group = 'dev.despical'
version = '1.0.5'
description = 'A clean TikTok media downloader for videos, photo posts, and galleries'

def npmCommand = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'npm.cmd' : 'npm'
def localEnvFile = file('.env')

def localEnv = providers.provider {
    if (!localEnvFile.exists()) {
        return [:]
    }

    localEnvFile.readLines()
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') && it.contains('=') }
        .collectEntries { line ->
            def separator = line.indexOf('=')
            [(line.substring(0, separator)): line.substring(separator + 1)]
        }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.mysql:mysql-connector-j'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.20.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'com.yubico:webauthn-server-core:2.9.0'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.cucumber:cucumber-java:7.34.8'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.8'
    testImplementation 'org.junit.platform:junit-platform-suite'

    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('npmInstall', Exec) {
    commandLine npmCommand, 'install'

    inputs.file('package.json')
    outputs.dir('node_modules')
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'npmInstall'

    commandLine npmCommand, 'run', 'build'

    inputs.dir('frontend')
    inputs.dir('src/main/resources/templates')
    inputs.file('package.json')

    outputs.dir('src/main/resources/static/dist')
}

tasks.named('processResources') {
    dependsOn 'buildFrontend'
}

tasks.named('bootRun') {
    environment localEnv.get()
}

springBoot {
    buildInfo()
}

flyway {
    configFiles = ['flyway.conf']
}
